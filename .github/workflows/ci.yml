name: CI

# Promotion flow:  feature/* → dev → staging → main (production)
on:
  push:
    branches: [dev, staging, main]
  pull_request:
    branches: [dev, staging, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every integration is optional in src/env.ts, so the quality gates run
  # without any secrets. Only the release job needs a token.
  SKIP_ENV_VALIDATION: 'true'

jobs:
  # ── Quality gates: run on every branch and every PR ───────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:run

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          # next build sets this itself, but pin it so a runner that exports
          # NODE_ENV can't break the build the way a local shell can.
          NODE_ENV: production

  # ── Migrations must apply cleanly before anything is promoted ─────────────
  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bramble_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bramble_ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Called directly, not via pnpm db:migrate / db:seed — those wrappers
      # shell out to Doppler, which CI doesn't need for a throwaway database.
      - name: Apply migrations
        run: pnpm exec drizzle-kit migrate
      # The seed is the only thing that exercises the schema through real
      # inserts, so it catches what a migration cannot: a constraint the writes
      # violate, a column the seed forgot, a relation that drifted. It also stops
      # the seed rotting silently as the schema changes.
      #
      # The script refuses any non-local host, and this DATABASE_URL is
      # localhost, so the guard passes here and still protects a real database.
      - name: Seed (proves the schema accepts real writes)
        run: pnpm exec tsx src/db/seeds/seed.ts

  # ── API tests: every branch. No browser, so they stay fast ────────────────
  api:
    name: API Tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # No `playwright install` — the api project uses only the request
      # fixture and never launches a browser.
      - run: pnpm test:api

  # ── Browser smoke tests: staging and production only ──────────────────────
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    # Runs on staging/main themselves, and on PRs targeting them — so it can
    # gate a promotion before the merge rather than reporting after it.
    if: >-
      github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main' ||
      github.base_ref == 'staging' || github.base_ref == 'main'
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ── Release: tag and generate notes from production only ──────────────────
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build, migrations]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
