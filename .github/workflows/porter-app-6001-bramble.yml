"on":
    push:
        branches:
            - main
name: Deploy to bramble
jobs:
    porter-deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Set Github tag
              id: vars
              run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
            - name: Setup porter
              uses: porter-dev/setup-porter@v0.2.0
            - name: Deploy stack
              timeout-minutes: 30
              # `--attach-env-groups` is load-bearing and not decoration.
              #
              # `porter.yaml` declares `envGroups: [bramble-prd]`, and this CLI
              # version silently ignores it — the first production deploy failed
              # with `DATABASE_URL is not set, so there is nothing to migrate`
              # because predeploy ran with no environment at all. Attaching it
              # here is what actually binds the group.
              #
              # Porter rewrites this file whenever the app's configuration
              # changes, in a pull request of its own. If a deploy ever fails on a
              # missing variable again, check that this flag survived that rewrite.
              run: porter apply --attach-env-groups bramble-prd
              env:
                PORTER_APP_NAME: bramble
                PORTER_CLUSTER: "6001"
                PORTER_DEPLOYMENT_TARGET_ID: 70bb5f5c-35a6-4780-a1c3-3d6875e1cd8b
                PORTER_HOST: https://dashboard.porter.run
                PORTER_PROJECT: "19721"
                PORTER_TAG: ${{ steps.vars.outputs.sha_short }}
                PORTER_TOKEN: ${{ secrets.PORTER_APP_19721_26114 }}
